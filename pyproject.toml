[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scorched"
version = "1.0.0"
description = "A lo-fi, cross-platform, LAN-multiplayer artillery game in the spirit of Scorched Earth"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["game", "artillery", "scorched-earth", "pygame", "lan", "multiplayer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = ["pygame-ce>=2.1.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
scorched = "scorched.__main__:main"

[tool.setuptools]
packages = ["lanlib", "scorched", "scorched.client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
